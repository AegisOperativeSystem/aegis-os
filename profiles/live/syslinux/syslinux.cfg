SERIAL 0 115200
UI menu.c32
MENU TITLE Aegis OS
PROMPT 0
TIMEOUT 30
DEFAULT arch

LABEL arch
MENU LABEL Boot Aegis OS
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet

LABEL existing
MENU LABEL Boot existing OS
COM32 chain.c32
APPEND hd0 0
